spring.application.name=mementoweb

server.port=${PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mementoweb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mementoweb}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mementoweb}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.security.admin.username=${MEMENTO_ADMIN_USERNAME}
app.security.admin.password=${MEMENTO_ADMIN_PASSWORD}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [requestId=%X{requestId:-system}] %logger{36} - %msg%n