# Evitar consultas SQL detalladas en los logs públicos.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Interpretar las cabeceras enviadas por el proxy de Render.
server.forward-headers-strategy=framework

# En producción, la cookie de sesión solo viaja mediante HTTPS.
server.servlet.session.cookie.secure=true

# Finalizar correctamente las peticiones activas durante un apagado.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# No exponer detalles internos en respuestas de error.
spring.web.error.include-exception=false
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never

app.public-base-url=${MEMENTO_PUBLIC_BASE_URL}